[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trl-intelligence"
version = "0.1.0"
description = "AI-powered Technology Readiness Level assessment system"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "PyMuPDF>=1.24",
    "joblib>=1.4.0"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "starlette>=0.46.0"
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "httpx>=0.27"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
